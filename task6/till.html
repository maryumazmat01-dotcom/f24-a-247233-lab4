<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniform Shop - Till</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="till">

        <!-- Same Shop -->
        <h1>Uniform Shop</h1>

        <!-- Back to Sheet -->
        <a href="index.html" class="sheet-link">
            Back to Sheet
        </a>

        <h2>Till</h2>

        <!-- Bill -->
        <label for="bill">Bill</label>

        <input
            type="text"
            id="bill"
            placeholder="Bill"
        >

        <!-- Customer Paid -->
        <label for="paid">Customer Paid</label>

        <input
            type="text"
            id="paid"
            placeholder="What the customer paid"
        >

        <!-- Take Button -->
        <button type="button" id="take-button">
            Take
        </button>

    </div>

</body>
</html>
