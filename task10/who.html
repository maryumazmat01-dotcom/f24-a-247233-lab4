<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniform Shop - Who is in</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="who">

        <h1>Uniform Shop</h1>

        <a href="index.html" class="sheet-link">
            Back to Sheet
        </a>

        <h2>Who is in</h2>

        <!-- Name Input -->
        <label for="person-name">Name</label>
        <input 
            type="text" 
            id="person-name" 
            placeholder="Enter name"
        >

        <!-- Buttons -->
        <div class="button-group">
            <button type="button" id="here-btn" class="person-btn">Here</button>
            <button type="button" id="out-btn" class="person-btn">Out</button>
        </div>

        <!-- List display -->
        <div class="people-list-section">
            <h3>People Status</h3>
            <ul id="people-list"></ul>
            <p>People in shop: <span id="count-in">0</span></p>
        </div>

        <footer>
            Roll No: 247233
        </footer>

    </div>

    <script>
        const people = [];

        const nameInput = document.getElementById("person-name");
        const hereBtn = document.getElementById("here-btn");
        const outBtn = document.getElementById("out-btn");
        const peopleList = document.getElementById("people-list");
        const countInSpan = document.getElementById("count-in");

        function renderPeople() {
            peopleList.innerHTML = "";
            let inCount = 0;

            people.forEach(function(person) {
                const li = document.createElement("li");
                
                // Read name and in status together from person object
                if (person.isIn) {
                    li.textContent = `${person.name} - In the shop`;
                    inCount++;
                } else {
                    li.textContent = `${person.name} - Not in the shop`;
                }

                peopleList.appendChild(li);
            });

            // Update the count of people in the shop
            countInSpan.textContent = inCount;
        }

        function addPerson(isInShop) {
            const name = nameInput.value.trim();
            if (name === "") return;

            // Save person object with name and status
            const person = {
                name: name,
                isIn: isInShop
            };

            people.push(person);
            renderPeople();
            nameInput.value = "";
        }

        hereBtn.addEventListener("click", function() {
            addPerson(true);
        });

        outBtn.addEventListener("click", function() {
            addPerson(false);
        });
    </script>

</body>
</html>
