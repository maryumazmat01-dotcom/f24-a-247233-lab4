<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniform Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sheet">

        <!-- Shop Heading -->
        <h1>Uniform Shop</h1>

        <!-- Sheet Table -->
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Line</th>
                    <th>Note</th>
                </tr>
            </thead>

            <tbody id="sheet-body">
            </tbody>
        </table>

        <!-- Form -->
        <form id="item-form">

            <input
                type="text"
                id="item"
                placeholder="Item"
            >

            <input
                type="number"
                id="quantity"
                placeholder="Quantity"
            >

            <input
                type="text"
                id="price"
                placeholder="Price"
            >

            <button type="submit">Add</button>

        </form>

        <!-- Footer -->
        <footer>
            Roll No: 247233
        </footer>

    </div>

    <script>

        // The rows array starts empty.
        const rows = [];

        const sheetBody = document.getElementById("sheet-body");
        const form = document.getElementById("item-form");


        // Draw the table from the array.
        function drawTable() {

            sheetBody.innerHTML = "";

            rows.forEach(function(row) {

                const tr = document.createElement("tr");

                tr.innerHTML = `
                    <td>${row.item}</td>
                    <td>${row.quantity}</td>
                    <td>${row.price}</td>
                    <td>${row.line}</td>
                    <td>${row.note}</td>
                `;

                sheetBody.appendChild(tr);
            });
        }


        // Add a row when Add is clicked.
        form.addEventListener("submit", function(event) {

            event.preventDefault();

            /*
             * If the item box is empty, value is "".
             * Convert it to undefined so the cell displays
             * "undefined".
             */
            const itemValue = document.getElementById("item").value;

            const item = itemValue === ""
                ? undefined
                : itemValue;


            const quantity = Number(
                document.getElementById("quantity").value
            );


            /*
             * Keep price as text.
             * Number(priceText) becomes NaN when the
             * price is not a number.
             */
            const priceText = document.getElementById("price").value;
            const price = Number(priceText);


            // Build one object.
            const row = {
                item: item,
                quantity: quantity,
                price: price,
                line: quantity * price,
                note: priceText + quantity
            };


            // Put the object at the end of the array.
            rows.push(row);


            // Draw the table again from the array.
            drawTable();


            // Empty all three boxes.
            document.getElementById("item").value = "";
            document.getElementById("quantity").value = "";
            document.getElementById("price").value = "";

        });

    </script>

</body>
</html>
